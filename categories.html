<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Cart - Categories</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
  <nav class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 py-4 px-6 md:px-10 flex flex-wrap items-center justify-between gap-4">
    <a href="index.html" class="text-2xl font-bold tracking-tight text-indigo-600">Quick Cart</a>
    <div class="flex flex-wrap items-center gap-5 text-sm font-medium text-slate-600">
      <a href="index.html" class="hover:text-indigo-600">Home</a>
      <a href="categories.html" class="text-indigo-600">Categories</a>
      <a href="product.html" class="hover:text-indigo-600">Products</a>
      <a href="cart.html" class="hover:text-indigo-600">Cart</a>
      <a href="profile.html" class="hover:text-indigo-600">Profile</a>
    </div>
  </nav>

  <header class="bg-gradient-to-r from-indigo-600 via-violet-600 to-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-6 py-16 text-center">
      <p class="text-sm uppercase tracking-[0.3em] text-cyan-200 mb-4">Explore the collection</p>
      <h1 class="text-4xl md:text-5xl font-extrabold leading-tight">Shop by category and discover what fits your style.</h1>
      <p class="mt-5 max-w-2xl mx-auto text-slate-100 text-base md:text-lg">Browse categories curated to help you find the perfect product quickly.</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <section class="grid gap-6 md:grid-cols-3" id="category-grid"></section>
  </main>

  <script>
    async function loadCategories() {
      const { data: categories, error } = await supabase.from('categories').select('*');
      if (error) return alert(error.message);

      const grid = document.getElementById('category-grid');
      grid.innerHTML = categories.map(cat => `
        <div class="bg-white p-6 border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition">
          <h2 class="text-xl font-bold text-gray-800">${cat.name}</h2>
          <p class="text-sm text-gray-500 mt-1">Slug: ${cat.slug}</p>
          <a href="product.html?category=${cat.id}" class="inline-block mt-4 text-indigo-600 font-semibold hover:underline">View Items &rarr;</a>
        </div>
      `).join('');
    }
    loadCategories();
  </script>
</body>
</html>
