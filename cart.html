<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopCentral - Cart</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabaseClient.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
  <nav class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 py-4 px-6 md:px-10 flex flex-wrap items-center justify-between gap-4">
    <a href="index.html" class="text-2xl font-bold tracking-tight text-indigo-600">ShopCentral</a>
    <div class="flex flex-wrap items-center gap-5 text-sm font-medium text-slate-600">
      <a href="index.html" class="hover:text-indigo-600">Home</a>
      <a href="categories.html" class="hover:text-indigo-600">Categories</a>
      <a href="product.html" class="hover:text-indigo-600">Products</a>
      <a href="cart.html" class="text-indigo-600">Cart</a>
      <a href="profile.html" class="hover:text-indigo-600">Profile</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Shopping Cart</h1>
    
    <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
      <div id="cart-list" class="divide-y divide-gray-200 mb-6"></div>

      <div class="flex justify-between items-center border-t border-gray-200 pt-4">
        <span class="text-xl font-bold text-gray-800">Total:</span>
        <span id="cart-total" class="text-2xl font-bold text-indigo-600">$0.00</span>
      </div>

      <div class="mt-6 flex justify-end space-x-4">
        <button onclick="clearCart()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition">Clear Cart</button>
        <!-- Fixed typo in href below -->
        <a href="cheakout.html" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 font-medium transition">Proceed to Checkout</a>
      </div>
    </div>
  </main>

  <script>
    function displayCart() {
      const cart = JSON.parse(localStorage.getItem('userCart')) || [];
      const list = document.getElementById('cart-list');
      let total = 0;

      if (cart.length === 0) {
        list.innerHTML = `<p class="text-gray-500 py-4 text-center">Your cart is currently empty.</p>`;
        document.getElementById('cart-total').innerText = `$0.00`;
        return;
      }

      list.innerHTML = cart.map((item, idx) => {
        // Safely parse price and quantity as numbers
        const price = Number(item.price) || 0;
        const quantity = Number(item.quantity) || 1;
        const itemTotal = price * quantity;
        total += itemTotal;

        return `
          <div class="py-4 flex justify-between items-center">
            <div>
              <h4 class="font-bold text-gray-800">${item.name || item.title || 'Product'}</h4>
              <p class="text-sm text-gray-500">$${price.toFixed(2)} x ${quantity}</p>
            </div>
            <div class="flex items-center space-x-4">
              <span class="font-semibold text-gray-700">$${itemTotal.toFixed(2)}</span>
              <button onclick="removeItem(${idx})" class="text-red-500 hover:text-red-700 text-sm font-medium">Remove</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('userCart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('userCart', JSON.stringify(cart));
      displayCart();
    }

    function clearCart() {
      localStorage.removeItem('userCart');
      displayCart();
    }

    // Initial render
    displayCart();
  </script>
</body>
</html>
