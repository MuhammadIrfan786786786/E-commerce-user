<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Cart - All Products</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
  <nav class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 py-4 px-6 md:px-10 flex flex-wrap items-center justify-between gap-4">
    <a href="index.html" class="text-2xl font-bold tracking-tight text-indigo-600">Quick Cart</a>
    <form class="store-search" action="product.html" method="get" role="search">
      <label class="sr-only" for="products-search">Search products</label>
      <input id="products-search" name="search" type="search" placeholder="Search products..." autocomplete="off">
      <button type="submit" aria-label="Search products">Search</button>
    </form>
    <div class="flex flex-wrap items-center gap-5 text-sm font-medium text-slate-600">
      <a href="index.html" class="hover:text-indigo-600">Home</a>
      <a href="categories.html" class="hover:text-indigo-600">Categories</a>
      <a href="product.html" class="text-indigo-600">Products</a>
      <a href="cart.html" class="hover:text-indigo-600">Cart</a>
      <a href="profile.html" class="hover:text-indigo-600">Profile</a>
    </div>
  </nav>

  <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-6 py-16 text-center">
      <p class="text-sm uppercase tracking-[0.3em] text-cyan-300 mb-4">Browse our catalog</p>
      <h1 class="text-4xl md:text-5xl font-extrabold leading-tight">Find products crafted for every style.</h1>
      <p class="mt-5 max-w-2xl mx-auto text-slate-300 text-base md:text-lg">Filter by category, view product details, and add items to your cart instantly.</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.3em] text-indigo-600 font-semibold">Product catalog</p>
        <h2 class="mt-2 text-3xl font-bold text-slate-900">Shop all items</h2>
      </div>
      <a href="categories.html" class="inline-flex items-center rounded-full border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50">Browse categories</a>
    </div>

    <section id="product-grid" class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3"></section>
  </main>

  <script>
    async function loadProducts() {
      const urlParams = new URLSearchParams(window.location.search);
      const categoryId = urlParams.get('category');
      const searchTerm = (urlParams.get('search') || '').trim().toLowerCase();
      const searchInput = document.getElementById('products-search');
      if (searchInput) searchInput.value = urlParams.get('search') || '';

      let query = supabase.from('products').select('*');
      if (categoryId) query = query.eq('category_id', categoryId);

      const { data: products, error } = await query;
      if (error) {
        document.getElementById('product-grid').innerHTML = '<p class="col-span-full rounded-lg border border-red-200 bg-red-50 p-6 text-center text-red-700">Products could not be loaded right now. Please try again.</p>';
        console.error('Error fetching products:', error);
        return;
      }

      const matchingProducts = (products || []).filter(product => {
        if (!searchTerm) return true;
        return `${product.name || ''} ${product.description || ''}`.toLowerCase().includes(searchTerm);
      });
      const grid = document.getElementById('product-grid');
      if (!matchingProducts.length) {
        grid.innerHTML = '<p class="col-span-full rounded-lg border border-dashed border-slate-300 bg-white p-10 text-center text-slate-500">No products found in this collection.</p>';
        return;
      }
      grid.innerHTML = matchingProducts.map(p => `
        <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm flex flex-col">
          <img src="${p.image_url || 'https://via.placeholder.com/300'}" class="h-48 w-full object-cover" alt="${p.name}">
          <div class="p-4 flex-1 flex flex-col">
            <h3 class="font-bold text-lg text-gray-800">${p.name}</h3>
            <p class="text-sm text-gray-500 mt-1 mb-2">${p.description || 'No description provided.'}</p>
            <p class="text-indigo-600 font-semibold text-xl mb-4">$${parseFloat(p.price).toFixed(2)}</p>
            <button data-id="${p.id}" class="add-to-cart-btn mt-auto w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700">Add to Cart</button>
          </div>
        </div>
      `).join('');

      grid.addEventListener('click', (event) => {
        const button = event.target.closest('.add-to-cart-btn');
        if (!button) return;
        const product = matchingProducts.find(item => String(item.id) === String(button.dataset.id));
        if (product) addToCart(product.id, product.name, product.price);
      });
    }

    function addToCart(id, name, price) {
      let cart = JSON.parse(localStorage.getItem('userCart')) || [];
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ id, name, price, quantity: 1 });
      }
      localStorage.setItem('userCart', JSON.stringify(cart));
      alert(`${name} added to cart!`);
    }

    loadProducts();
  </script>
</body>
</html>
