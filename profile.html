<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Cart - Profile</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/search.js" defer></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
  <nav class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 py-4 px-6 md:px-10 flex flex-wrap items-center justify-between gap-4">
    <a href="index.html" class="text-2xl font-bold tracking-tight text-indigo-600">Quick Cart</a>
    <form class="store-search" action="product.html" method="get" role="search">
      <label class="sr-only" for="profile-search">Search products</label>
      <input id="profile-search" name="search" type="search" placeholder="Search products..." autocomplete="off">
      <button type="submit" aria-label="Search products">Search</button>
    </form>
    <div class="flex flex-wrap items-center gap-5 text-sm font-medium text-slate-600">
      <a href="index.html" class="hover:text-indigo-600">Home</a>
      <a href="categories.html" class="hover:text-indigo-600">Categories</a>
      <a href="product.html" class="hover:text-indigo-600">Products</a>
      <a href="cart.html" class="hover:text-indigo-600">Cart</a>
      <a href="profile.html" class="text-indigo-600">Profile</a>
      <a href="contact.html" class="hover:text-indigo-600">Support</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white p-6 rounded-lg shadow border border-gray-200 mb-8 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <img
          id="profile-avatar"
          src="https://ui-avatars.com/api/?name=User&background=e76843&color=fff&size=150"
          alt="Profile picture"
          referrerpolicy="no-referrer"
          loading="eager"
          decoding="async"
          class="profile-avatar h-16 w-16 rounded-full object-cover"
        >
        <div>
          <h1 id="profile-display-name" class="text-2xl font-bold text-gray-800">User Profile</h1>
          <p id="user-display-email" class="text-gray-500 mt-1">Not logged in</p>
        </div>
      </div>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Log Out</button>
    </div>

    <h2 class="text-xl font-bold text-gray-800 mb-4">Your Order History</h2>
    <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="p-4 text-sm font-semibold text-gray-600">Order ID</th>
            <th class="p-4 text-sm font-semibold text-gray-600">Total Amount</th>
            <th class="p-4 text-sm font-semibold text-gray-600">Status</th>
          </tr>
        </thead>
        <tbody id="user-orders" class="divide-y divide-gray-200">
          </tbody>
      </table>
    </div>
  </main>

  <script>
    const profileAvatar = document.getElementById('profile-avatar');
    const profileName = document.getElementById('profile-display-name');

    function setProfileAvatar(user, displayName) {
      const metadata = user.user_metadata || {};
      const identityData = user.identities?.[0]?.identity_data || {};
      const avatarUrl = metadata.avatar_url || metadata.picture || metadata.image_url || identityData.avatar_url || identityData.picture;
      const fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=e76843&color=fff&size=150`;

      profileAvatar.src = avatarUrl || fallbackUrl;
      profileAvatar.onerror = () => {
        profileAvatar.onerror = null;
        profileAvatar.src = fallbackUrl;
      };
    }

    async function loadProfile() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const email = user.email;
      const metadata = user.user_metadata || {};
      const displayName = metadata.full_name || metadata.name || email?.split('@')[0] || 'User Profile';
      localStorage.setItem('userEmail', email || '');
      profileName.innerText = displayName;
      document.getElementById('user-display-email').innerText = email || 'Logged in user';
      setProfileAvatar(user, displayName);
      loadUserOrders(email);
    }

    async function loadUserOrders(userEmail) {
      const { data: orders, error } = await supabase.from('orders').select('*').eq('user_email', userEmail);
      if (error) return;

      const tbody = document.getElementById('user-orders');
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">No previous orders found.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td class="p-4 text-sm font-medium">#${o.id}</td>
          <td class="p-4 text-sm">$${parseFloat(o.total_amount).toFixed(2)}</td>
          <td class="p-4 text-sm"><span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs font-semibold">${o.status}</span></td>
        </tr>
      `).join('');
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();
      if (error) {
        alert('Logout failed: ' + error.message);
        return;
      }
      localStorage.removeItem('userEmail');
      window.location.href = 'login.html';
    }

    loadProfile();
  </script>
</body>
</html>
