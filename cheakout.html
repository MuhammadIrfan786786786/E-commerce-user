<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Cart - Checkout</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white border-b border-gray-200 py-4 px-8 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-indigo-600">Quick Cart</a>
  </nav>

  <main class="max-w-xl mx-auto px-4 py-12">
    <div class="bg-white p-8 rounded-lg shadow border border-gray-200">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">Complete Checkout</h1>
      <form id="checkout-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" id="checkout-email" required readonly class="w-full mt-1 p-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Shipping Address</label>
          <textarea id="checkout-address" required rows="3" class="w-full mt-1 p-2 border border-gray-300 rounded-md"></textarea>
        </div>
        <div class="border-t border-gray-200 pt-4 flex justify-between font-bold text-lg">
          <span>Total Order Value:</span>
          <span id="order-total">$0.00</span>
        </div>
        <button id="place-order-button" type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-md hover:bg-indigo-700 font-semibold transition">Place Order</button>
      </form>
    </div>
  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem('userCart')) || [];
    let verifiedTotal = 0;
    let verifiedCart = [];

    async function verifyCartPrices() {
      if (!cart.length) {
        document.getElementById('order-total').innerText = '$0.00';
        return false;
      }

      const productIds = cart.map(item => item.id).filter(Boolean);
      const { data: products, error } = await supabase.from('products').select('id, price, name').in('id', productIds);
      if (error || !products?.length) {
        alert('Your cart could not be verified. Please return to products and try again.');
        return false;
      }

      const productMap = new Map(products.map(product => [String(product.id), product]));
      verifiedCart = cart
        .map(item => {
          const product = productMap.get(String(item.id));
          const quantity = Math.max(1, Number(item.quantity) || 1);
          if (!product) return null;
          return { product, quantity };
        })
        .filter(Boolean);

      if (!verifiedCart.length) return false;
      verifiedTotal = verifiedCart.reduce((sum, item) => sum + (Number(item.product.price) * item.quantity), 0);
      document.getElementById('order-total').innerText = `$${verifiedTotal.toFixed(2)}`;
      return true;
    }

    // Autofill email if user logged in
    async function loadCheckoutUser() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('checkout-email').value = user.email || '';
    }
    loadCheckoutUser();
    verifyCartPrices();

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!(await verifyCartPrices())) return;

      const button = document.getElementById('place-order-button');
      button.disabled = true;
      button.innerText = 'Placing order...';

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      const user_email = user.email;
      const shipping_address = document.getElementById('checkout-address').value;

      const { data, error } = await supabase.from('orders').insert([
        { user_email, total_amount: verifiedTotal, shipping_address, status: 'Pending' }
      ]);

      if (error) {
        alert('Checkout failed: ' + error.message);
        button.disabled = false;
        button.innerText = 'Place Order';
      } else {
        alert('Order placed successfully!');
        localStorage.removeItem('userCart');
        window.location.href = 'profile.html';
      }
    });
  </script>
</body>
</html>
