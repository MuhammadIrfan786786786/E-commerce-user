<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopCentral - Checkout</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white border-b border-gray-200 py-4 px-8 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-indigo-600">ShopCentral</a>
  </nav>

  <main class="max-w-xl mx-auto px-4 py-12">
    <div class="bg-white p-8 rounded-lg shadow border border-gray-200">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">Complete Checkout</h1>
      <form id="checkout-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" id="checkout-email" required class="w-full mt-1 p-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Shipping Address</label>
          <textarea id="checkout-address" required rows="3" class="w-full mt-1 p-2 border border-gray-300 rounded-md"></textarea>
        </div>
        <div class="border-t border-gray-200 pt-4 flex justify-between font-bold text-lg">
          <span>Total Order Value:</span>
          <span id="order-total">$0.00</span>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-md hover:bg-indigo-700 font-semibold transition">Place Order</button>
      </form>
    </div>
  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem('userCart')) || [];
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    document.getElementById('order-total').innerText = `$${total.toFixed(2)}`;

    // Autofill email if user logged in
    const loggedEmail = localStorage.getItem('userEmail');
    if (loggedEmail) document.getElementById('checkout-email').value = loggedEmail;

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (cart.length === 0) return alert('Your cart is empty!');

      const user_email = document.getElementById('checkout-email').value;
      const shipping_address = document.getElementById('checkout-address').value;

      const { data, error } = await supabase.from('orders').insert([
        { user_email, total_amount: total, shipping_address, status: 'Pending' }
      ]);

      if (error) {
        alert('Checkout failed: ' + error.message);
      } else {
        alert('Order placed successfully!');
        localStorage.removeItem('userCart');
        window.location.href = 'profile.html';
      }
    });
  </script>
</body>
</html>
